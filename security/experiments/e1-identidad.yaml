apiVersion: security-chaos/v1
kind: SecurityExperiment
metadata:
  name: e1-identidad-maquina
spec:
  owner: pendiente-de-confirmar
  control: identidad-de-maquina-y-minimo-privilegio
  hypothesisRef: security/game-day/hipotesis.md#e1---identidad-de-máquina-o-agente
  preconditions:
    - identidad-de-prueba-propia-confirmada
    - origen-no-previsto-controlado-y-reversible
    - auditoria-de-iam-activa
    - estado-estable-medido
  scope:
    resources: pendiente-de-confirmar
    data: sinteticos-desechables
  injection:
    method: usar-identidad-de-prueba-desde-origen-no-previsto
    destructive: false
  signals:
    - security_authentication_denied
    - trace_id-del-flujo
  detection:
    rule: identity-unexpected-origin
    implementation: src/common/team-api-key/team-api-key.guard.ts
    start_event: solicitud-rechazada-con-una-identidad-u-origen-no-previsto
    containment_event: acceso-rechazado-y-solicitud-sin-efecto
    evidence: security/evidence-schema.json
  stopConditions:
    - afectar-identidad-administrativa
    - acceso-a-datos-reales
    - perdida-de-trazabilidad
  rollback:
    method: revocar-identidad-de-prueba-y-confirmar-denegacion
  status: diseno-pendiente-de-alcance
