apiVersion: security-chaos/v1
kind: SecurityExperiment
metadata:
  name: e4-resiliencia-datos
spec:
  owner: deport-back
  control: contencion-de-borrado-masivo-backups-pitr-y-copia-aislada
  hypothesisRef: security/experiments/e4-datos/README.md
  preconditions:
    - lote-sintetico-de-50-registros-e4-creado-por-el-script
    - ids-del-flujo-fuera-del-alcance
    - regla-de-alerta-borrado-masivo-en-grafana
    - ronda-1-backups-y-pitr-activos
  scope:
    resources: deport-back-sql/deport_db/deportistas
    data: registros-sinteticos-e4-example-com
  injection:
    method: borrado-masivo-via-api-con-credencial-valida
    mitre: T1078+T1485-pendiente-verificar-en-attack.mitre.org
    destructive: true
    script: security/experiments/e4-datos/ejecutar.sh
  signals:
    - evento-deportista_deleted
    - evento-security_mass_delete_blocked
    - alerta-E4-Borrado-masivo-de-deportistas
    - trace_id-gd-exp4
  metrics:
    - rpo
    - rto
    - mttd
    - mttc
  stopConditions:
    - id-del-flujo-afectado
    - clon-no-disponible
    - parar-manual
    - script: security/experiments/e4-datos/parar.sh
  rollback:
    method: borrar-lote-e4-restaurar-control-y-borrar-clones
    script: security/experiments/e4-datos/revertir.sh
    success: REVERSION OK
  workflow: .github/workflows/gameday-e4.yml
  status: listo-para-ejecutar
version: "0.2"
