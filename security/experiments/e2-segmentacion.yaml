apiVersion: security-chaos/v1
kind: SecurityExperiment
metadata:
  name: e2-exposicion-segmentacion
spec:
  owner: deport-back
  control: segmentacion-y-denegacion-por-defecto
  hypothesisRef: security/game-day/hipotesis.md#e2---exposición-y-segmentación
  preconditions:
    - recurso-propio-confirmado
    - copia-de-la-regla-y-reversion-probada
    - telemetria-de-red-activa
    - estado-estable-medido
  scope:
    resources: pendiente-de-confirmar
    data: sinteticos-desechables
  injection:
    method: introducir-ruta-no-declarada-en-recurso-de-prueba
    destructive: false
  signals:
    - evento-de-cambio-de-red
    - flujo-bloqueado-o-alerta
    - trace_id-del-flujo
  stopConditions:
    - exponer-puerto-administrativo
    - afectar-terceros
    - perdida-de-trazabilidad
  rollback:
    method: eliminar-regla-de-prueba-y-restaurar-configuracion
  status: diseno-pendiente-de-alcance
