services:
  postgres:
    image: postgres:16-alpine
    container_name: deport-postgres
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: deport-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  postgres_data:
