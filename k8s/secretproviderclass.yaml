# Requiere el add-on "Secret Manager add-on for GKE" habilitado en el cluster.
# Sincroniza los secrets de Secret Manager a un Secret nativo de k8s llamado
# deport-back-db, con las mismas claves que ya consume deployment.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: deport-back-db
  namespace: deport-back
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/CAMBIAR-project-id/secrets/db-username/versions/latest"
        fileName: "DB_USERNAME"
      - resourceName: "projects/CAMBIAR-project-id/secrets/db-password/versions/latest"
        fileName: "DB_PASSWORD"
      - resourceName: "projects/CAMBIAR-project-id/secrets/db-name/versions/latest"
        fileName: "DB_NAME"
      - resourceName: "projects/CAMBIAR-project-id/secrets/team-api-key/versions/latest"
        fileName: "TEAM_API_KEY"
  secretObjects:
    - secretName: deport-back-db
      type: Opaque
      data:
        - objectName: DB_USERNAME
          key: DB_USERNAME
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
        - objectName: DB_NAME
          key: DB_NAME
        - objectName: TEAM_API_KEY
          key: TEAM_API_KEY
