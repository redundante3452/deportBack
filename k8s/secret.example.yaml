# Plantilla. Copiar a k8s/secret.yaml y elegir usuario/password/db propios
# (los inventas tú, no vienen de ningún servicio externo). Ese archivo real
# NUNCA se commitea (ya está en .gitignore). Estas mismas credenciales las
# usan tanto deport-back (DB_USERNAME/DB_PASSWORD/DB_NAME) como el pod de
# postgres (POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB en postgres-deployment.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: deport-back-db
  namespace: deport-back
type: Opaque
stringData:
  DB_USERNAME: "CAMBIAR"
  DB_PASSWORD: "CAMBIAR"
  DB_NAME: "CAMBIAR"
