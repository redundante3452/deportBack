apiVersion: v1
kind: ConfigMap
metadata:
  name: deport-back-config
  namespace: deport-back
data:
  NODE_ENV: "production"
  PORT: "3000"
  # postgres corre como pod dentro del mismo cluster (ver postgres-service.yaml)
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_SSL: "false"
  # URLs públicas de las otras 2 APIs del seguimiento (no son secretas)
  API_FASTIFY_URL: "http://CAMBIAR-api-fastify"
  INVENTARIO_U_URL: "http://CAMBIAR-inventario-u"
