apiVersion: apps/v1
kind: Deployment
metadata:
  name: deport-back
  namespace: deport-back
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deport-back
  template:
    metadata:
      labels:
        app: deport-back
    spec:
      serviceAccountName: deport-back-sa
      containers:
        - name: deport-back
          # fijado al digest exacto a propósito: GKE Autopilot cachea el tag ":latest"
          # (Image Streaming) y ya nos sirvió una imagen vieja más de una vez con el tag solo.
          # Después de cada "gcloud builds submit" hay que actualizar este digest a mano.
          image: us-central1-docker.pkg.dev/deport-back/deport-back/deport-back@sha256:503f8597f0a8b8ee77450520fc75027931886ef388a09cf6afa03317848c98aa
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: deport-back-config
            - secretRef:
                name: deport-back-db
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
          args:
            - "--port=5432"
            # la instancia se recreó en southamerica-east1 por STOCKOUT en us-central1
            - "deport-back:southamerica-east1:deport-back-db-2"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
