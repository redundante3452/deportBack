# Service account de Kubernetes ligado por Workload Identity a una service
# account de GCP con los roles roles/cloudsql.client y
# roles/secretmanager.secretAccessor (ver README para el comando de binding).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deport-back-sa
  namespace: deport-back
  annotations:
    iam.gke.io/gcp-service-account: deport-back-sa@CAMBIAR-project-id.iam.gserviceaccount.com
