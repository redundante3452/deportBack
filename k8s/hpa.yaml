apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: deport-back
  namespace: deport-back
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deport-back
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
