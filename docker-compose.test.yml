services:
  # ─────────────────────────────────────────────────────────────
  # Pruebas unitarias — no necesitan base de datos
  # Ejecutar: pnpm test:unit:docker
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      NODE_ENV: test
    # CMD del Dockerfile.test corre "pnpm test:cov"

  # ─────────────────────────────────────────────────────────────
  # Base de datos de prueba local — solo para entorno local
  # En CI/CD tambien se usa este Postgres efimero (sin secretos)
  # ─────────────────────────────────────────────────────────────
  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: deport_test
      POSTGRES_PASSWORD: deport_test
      POSTGRES_DB: deport_test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deport_test -d deport_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # Pruebas E2E
  # - Local y CI/CD: usan db-test (PostgreSQL 15 efimero en Docker)
  # Ejecutar: pnpm test:e2e:docker
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      # Credenciales fijas de prueba (no secretas) del Postgres efimero
      DB_HOST: db-test
      DB_PORT: "5432"
      DB_USERNAME: deport_test
      DB_PASSWORD: deport_test
      DB_NAME: deport_test_db
      DB_SSL: "false"
      NODE_ENV: test
    depends_on:
      db-test:
        condition: service_healthy
    command: sh -c "pnpm test:e2e --forceExit"
