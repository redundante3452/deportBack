services:
  # ─────────────────────────────────────────────────────────────
  # Pruebas unitarias — no necesitan base de datos
  # Ejecutar: pnpm test:unit:docker
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      NODE_ENV: test
    # CMD del Dockerfile.test corre "pnpm test:cov"

  # ─────────────────────────────────────────────────────────────
  # Base de datos de prueba local — solo para entorno local
  # En CI/CD se usa la BD de Supabase via variables de entorno
  # ─────────────────────────────────────────────────────────────
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deport_test
      POSTGRES_PASSWORD: deport_test
      POSTGRES_DB: deport_test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deport_test -d deport_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # Pruebas E2E
  # - Local: usa db-test (PostgreSQL en Docker)
  # - CI/CD: usa variables de entorno de GitHub Secrets (BD Supabase)
  # Ejecutar: pnpm test:e2e:docker
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    env_file:
      - path: .env.test
        required: false
    environment:
      # Si no se proveen variables externas, usa la BD local de Docker
      DB_HOST: ${DB_HOST:-db-test}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-deport_test}
      DB_PASSWORD: ${DB_PASSWORD:-deport_test}
      DB_NAME: ${DB_NAME:-deport_test_db}
      DB_SSL: ${DB_SSL:-false}
      NODE_ENV: test
    depends_on:
      db-test:
        condition: service_healthy
    command: sh -c "pnpm test:e2e --forceExit"
