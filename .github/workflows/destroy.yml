name: Destroy Google Cloud infrastructure

on:
  workflow_dispatch:

env:
  APP_NAME: deport-back
  TF_IN_AUTOMATION: true
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'deport-back' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'deport-back_cloudbuild' }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-deport-back-state
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate in Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Destroy infrastructure
        working-directory: terraform
        run: |
          terraform destroy -auto-approve \
            -lock-timeout=10m \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="app_name=${{ env.APP_NAME }}"
