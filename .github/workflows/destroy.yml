name: Destroy Google Cloud infrastructure

on:
  workflow_dispatch:

env:
  APP_NAME: deport-back
  TF_IN_AUTOMATION: true
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'deport-back' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'deport-back_cloudbuild' }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-deport-back-state
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate in Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -reconfigure -input=false -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Show managed resources
        working-directory: terraform
        run: |
          echo "Recursos administrados por el estado remoto:"
          terraform state list
          test -n "$(terraform state list)"

      - name: Limpiar recursos del experimento E4
        run: |
          for b in $(gcloud storage buckets list --project="${{ env.GCP_PROJECT_ID }}" --format='value(name)' 2>/dev/null | grep -- '-e4-copias-' || true); do
            echo "Limpiando bucket $b"
            gcloud storage buckets update "gs://$b" --clear-retention-period || true
            gcloud storage rm -r --all-versions "gs://$b/**" || true
          done
          for i in $(gcloud sql instances list --project="${{ env.GCP_PROJECT_ID }}" --format='value(name)' 2>/dev/null | grep '^deport-back-sql-e4-clone' || true); do
            echo "Borrando instancia $i"
            gcloud sql instances delete "$i" --project="${{ env.GCP_PROJECT_ID }}" --quiet || true
          done

      - name: Plan infrastructure destruction
        working-directory: terraform
        run: |
          terraform plan -destroy -input=false -out destroy.tfplan \
            -lock-timeout=10m \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="db_region=${{ env.GCP_REGION }}" \
            -var="app_name=${{ env.APP_NAME }}" \
            -var="db_name=deport_db" \
            -var="db_user=deport_user" \
            -var="enable_db_backups=${{ vars.ENABLE_DB_BACKUPS || 'false' }}" \
            -var="gke_cluster_name=${{ env.APP_NAME }}-gke" \
            -var="gke_namespace=${{ env.APP_NAME }}"

      - name: Apply destruction plan
        working-directory: terraform
        run: terraform apply -input=false -auto-approve -lock-timeout=10m destroy.tfplan
