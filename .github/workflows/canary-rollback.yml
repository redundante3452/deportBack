name: Canary rollback demo

on:
  workflow_dispatch:

env:
  APP_NAME: deport-back
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'deport-back' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  CANARY_BAKE_SECONDS: '10'
  CANARY_SAMPLE_SIZE: '10'
  CANARY_START_PERCENT: '10'
  CANARY_MAX_ERROR_RATE: '0'
  CANARY_MAX_LATENCY_MS: '1000'
  CANARY_INJECT_FAILURE: 'true'

jobs:
  rollback:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-deport-back-state
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate in Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Inject controlled canary regression and verify real rollback
        run: |
          set +e
          bash scripts/canary-promote.sh
          PROMOTION_STATUS=$?

          if [[ "$PROMOTION_STATUS" -eq 0 ]]; then
            echo "Canary promovido sin regresiones reales; no fue necesario hacer rollback."
            exit 0
          fi

          for attempt in {1..12}; do
            SERVICE_JSON="$(gcloud run services describe "$APP_NAME" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format=json)"

            STABLE_TAG_COUNT="$(jq '[.status.traffic[] | select(.tag=="stable")] | length' <<<"$SERVICE_JSON")"
            CANARY_TAG_COUNT="$(jq '[.status.traffic[] | select(.tag=="canary")] | length' <<<"$SERVICE_JSON")"
            STABLE_PERCENT="$(jq -r '.status.traffic[] | select(.tag=="stable") | (.percent // 0)' <<<"$SERVICE_JSON")"
            CANARY_PERCENT="$(jq -r '.status.traffic[] | select(.tag=="canary") | (.percent // 0)' <<<"$SERVICE_JSON")"

            if [[ "$STABLE_TAG_COUNT" -eq 1 && "$CANARY_TAG_COUNT" -eq 1 \
              && "$STABLE_PERCENT" -eq 100 && "$CANARY_PERCENT" -eq 0 ]]; then
              echo "Rollback real confirmado por Cloud Run: stable=100%, canary=0%."
              exit 0
            fi

            echo "Esperando tráfico estable después del rollback (intento $attempt/12)..."
            sleep 5
          done

          echo "Cloud Run no confirmó stable=100% y canary=0% después del rollback." >&2
          exit 1
