name: Deploy to Google Cloud

on:
  push:
    branches:
      - main

env:
  APP_NAME: deport-back
  TF_IN_AUTOMATION: true
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'deport-back' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'deport-back_cloudbuild' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate in Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Create Artifact Registry repository
        working-directory: terraform
        run: |
          terraform apply \
            -target=google_artifact_registry_repository.repo \
            -auto-approve \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="app_name=${{ env.APP_NAME }}"

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run and database
        working-directory: terraform
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ github.sha }}
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="app_name=${{ env.APP_NAME }}" \
            -var="image=$IMAGE"
