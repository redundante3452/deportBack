name: Deploy to Google Cloud

on:
  push:
    branches:
      - main

env:
  APP_NAME: deport-back
  TF_IN_AUTOMATION: true
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'deport-back' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'deport-back_cloudbuild' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-deport-back-state
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate in Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable required Google Cloud APIs
        run: |
          gcloud services enable \
            artifactregistry.googleapis.com \
            run.googleapis.com \
            sqladmin.googleapis.com \
            secretmanager.googleapis.com \
            iam.googleapis.com \
            cloudresourcemanager.googleapis.com \
            serviceusage.googleapis.com \
            --project="${{ env.GCP_PROJECT_ID }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Create Artifact Registry repository
        working-directory: terraform
        run: |
          if ! terraform state list | grep -qx 'google_artifact_registry_repository.repo'; then
            if gcloud artifacts repositories describe "${{ env.APP_NAME }}" \
              --location="${{ env.GCP_REGION }}" \
              --project="${{ env.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
              terraform import \
                -lock-timeout=10m \
                -var="project_id=${{ env.GCP_PROJECT_ID }}" \
                -var="region=${{ env.GCP_REGION }}" \
                -var="app_name=${{ env.APP_NAME }}" \
                google_artifact_registry_repository.repo \
                "projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/repositories/${{ env.APP_NAME }}"
            fi
          fi

          terraform apply \
            -target=google_artifact_registry_repository.repo \
            -lock-timeout=10m \
            -auto-approve \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="app_name=${{ env.APP_NAME }}"

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run and database
        working-directory: terraform
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ github.sha }}
        run: |
          terraform apply -auto-approve \
            -lock-timeout=10m \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="app_name=${{ env.APP_NAME }}" \
            -var="image=$IMAGE"
