name: Deploy to Google Cloud

# Despliegue manual: se lanza desde Actions > Deploy to Google Cloud > Run workflow
on:
  workflow_dispatch:

env:
  APP_NAME: deport-back
  TF_IN_AUTOMATION: true
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'deport-back' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'deport-back_cloudbuild' }}

jobs:
  deploy:
    if: ${{ vars.ENABLE_GCP_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-deport-back-state
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate in Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable required Google Cloud APIs
        run: |
          gcloud services enable \
            artifactregistry.googleapis.com \
            container.googleapis.com \
            run.googleapis.com \
            sqladmin.googleapis.com \
            secretmanager.googleapis.com \
            iam.googleapis.com \
            cloudresourcemanager.googleapis.com \
            monitoring.googleapis.com \
            logging.googleapis.com \
            serviceusage.googleapis.com \
            --project="${{ env.GCP_PROJECT_ID }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Create Artifact Registry repository
        working-directory: terraform
        run: |
          if ! terraform state list | grep -qx 'google_artifact_registry_repository.repo'; then
            if gcloud artifacts repositories describe "${{ env.APP_NAME }}" \
              --location="${{ env.GCP_REGION }}" \
              --project="${{ env.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
              terraform import \
                -lock-timeout=10m \
                -var="project_id=${{ env.GCP_PROJECT_ID }}" \
                -var="region=${{ env.GCP_REGION }}" \
                -var="app_name=${{ env.APP_NAME }}" \
                google_artifact_registry_repository.repo \
                "projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/repositories/${{ env.APP_NAME }}"
            fi
          fi

          terraform apply \
            -target=google_artifact_registry_repository.repo \
            -lock-timeout=10m \
            -auto-approve \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="app_name=${{ env.APP_NAME }}"

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Resolve immutable image digest
        id: image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ github.sha }}
        run: |
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --format='value(image_summary.digest)')"
          IMAGE_REPOSITORY="${IMAGE%:*}"
          IMMUTABLE_IMAGE="${IMAGE_REPOSITORY}@${DIGEST}"
          echo "IMAGE=${IMMUTABLE_IMAGE}" >> "$GITHUB_ENV"
          echo "immutable_image=${IMMUTABLE_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run and database
        working-directory: terraform
        env:
          IMAGE: ${{ steps.image.outputs.immutable_image }}
          TF_VAR_team_api_key: ${{ secrets.TEAM_API_KEY }}
          # URLs de las APIs de los compañeros: variables del repo (Settings > Variables)
          TF_VAR_api_fastify_url: ${{ vars.API_FASTIFY_URL }}
          TF_VAR_inventario_u_url: ${{ vars.INVENTARIO_U_URL }}
        run: |
          terraform apply -auto-approve \
            -lock-timeout=10m \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="db_region=${{ env.GCP_REGION }}" \
            -var="app_name=${{ env.APP_NAME }}" \
            -var="image=$IMAGE"

      - name: Obtener URL de Terraform
        id: service-url
        working-directory: terraform
        run: |
          SERVICE_URL="$(terraform output -raw service_url)"
          test -n "$SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### URL de Cloud Run"
            echo "$SERVICE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Canary (entrega anterior): workflow manual 'Canary release (Cloud Run)'." >> "$GITHUB_STEP_SUMMARY"
