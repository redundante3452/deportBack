name: 🚀 CI — Ambiente Producción

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: 🔬 Pruebas + Cobertura (≥ 85%)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐳 Construir imagen Docker de pruebas
        run: docker compose -f docker-compose.test.yml build unit-tests

      - name: ✅ Ejecutar pruebas unitarias en Docker
        run: |
          docker compose -f docker-compose.test.yml run --rm unit-tests \
            sh -c "pnpm test:cov --coverageReporters=json-summary --forceExit"

      - name: 📊 Verificar cobertura mínima ≥ 85% (Quality Gate)
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['total']['statements']['pct'])")
          echo "📊 Cobertura actual: $COVERAGE%"
          THRESHOLD=85
          PASS=$(python3 -c "print('ok' if float('$COVERAGE') >= $THRESHOLD else 'fail')")
          if [ "$PASS" = "fail" ]; then
            echo "❌ Cobertura $COVERAGE% es menor al $THRESHOLD% requerido para Producción"
            exit 1
          fi
          echo "✅ Quality Gate aprobado: $COVERAGE% >= $THRESHOLD%"

      - name: 🌐 Ejecutar pruebas E2E en Docker
        run: docker compose -f docker-compose.test.yml run --rm e2e-tests
        env:
          DB_HOST: ${{ secrets.DB_HOST_PRODUCTION }}
          DB_PORT: 5432
          DB_USERNAME: ${{ secrets.DB_USERNAME_PRODUCTION }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_PRODUCTION }}
          DB_NAME: ${{ secrets.DB_NAME_PRODUCTION }}
          DB_SSL: "true"

      - name: 🧹 Limpiar contenedores Docker
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

  deploy:
    name: 🚀 Deploy → Producción
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🚂 Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: 🚀 Deploy a Railway (Producción)
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_PRODUCTION }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
